spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: >
      classpath:db/migration/schema,
      classpath:db/migration/data/common,
      classpath:db/migration/data/prod
    # Duro en prod
    validate-on-migrate: true
    clean-disabled: true