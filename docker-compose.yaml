version: '3.8'

services:
  db:
    image: postgres:16
    container_name: bookme-db
    environment:
      POSTGRES_DB: bookme
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5443:5432"
    volumes:
      - bookme_data:/var/lib/postgresql/data

volumes:
  bookme_data:
